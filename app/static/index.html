<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>paperdrift</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--fg:#e8eaed;--dim:#8b93a1;--accent:#7aa2ff;--like:#3ecf8e;--nope:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--panel:#fff;--line:#dde0e6;--fg:#1c1f24;--dim:#6b7280;--accent:#3b6bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
header .grow{flex:1;min-width:140px}
header select{width:auto;max-width:60vw}
main{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.status{color:var(--dim);font-size:13px;margin:6px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:pan-y;transition:transform .15s}
.card .pic{background:#000;display:flex;justify-content:center;height:var(--picH);width:100%}   /* 固定尺寸的图框：每张图都一样大，下面的按钮位置就不会跳 */
.card img{width:100%;height:100%;object-fit:contain;display:block}
.card .meta{padding:0 14px;height:52px;overflow:hidden;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:6px;align-content:center;align-items:center;font-size:13px;color:var(--dim)}
.badge{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.badge.video{border-color:var(--accent);color:var(--accent)}
.tags{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:5px;height:64px;overflow:hidden;align-content:flex-start}
.tags span{font-size:12px;background:var(--bg);border-radius:6px;padding:1px 7px;color:var(--dim)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;padding:14px;font-size:18px}
.actions .like{background:var(--like);border-color:var(--like);color:#04210f}
.actions .nope{background:var(--nope);border-color:var(--nope);color:#2b0505}
.reasons{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.reasons .rl{font-size:13px;color:var(--dim);margin-right:2px}
.reasons button{padding:6px 10px;font-size:13px}
.stage{position:relative}
.card .pic{position:relative;align-items:center}
:root{--picH:clamp(220px,calc(100vh - 620px),620px)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:42px;height:64px;padding:0;border:none;border-radius:12px;
  background:rgba(0,0,0,.5);color:#fff;font-size:30px;line-height:1;cursor:pointer}
.nav:hover{background:rgba(0,0,0,.75)}.nav:disabled{opacity:.25;cursor:default}
.nav.prev{left:6px}.nav.next{right:6px}
.bslot{height:46px;margin-top:10px}
.banner{height:100%;box-sizing:border-box;padding:8px 12px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.banner.liked{background:#3ecf8e22;color:var(--like)}.banner.rejected{background:#ff6b6b22;color:var(--nope)}
.banner button{padding:3px 10px;font-size:13px}
.hint{color:var(--dim);font-size:12px;margin-top:10px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grid .cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.grid img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;display:block}   /* contain：整张图等比缩小，不裁剪 */
.grid .row{display:flex;gap:6px;padding:6px;font-size:12px}
.grid .row a,.grid .row button{flex:1;text-align:center;padding:5px;border-radius:8px;border:1px solid var(--line);color:inherit;text-decoration:none;background:none;font-size:12px}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:2px 0 6px}
.progress .bar{height:100%;background:var(--accent);transition:width .6s}
.mini{padding:2px 10px;font-size:12px;margin-left:6px}
.warn{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:13px;background:#ffb02033;color:#b86e00}
@media (prefers-color-scheme:dark){.warn{color:#ffc55a}}
.empty{text-align:center;color:var(--dim);padding:60px 0}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;max-width:460px;width:92vw;padding:20px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:12px 0 4px;font-size:13px;color:var(--dim)}
.login{max-width:340px;margin:18vh auto;padding:0 16px}
.login h1{font-size:22px;margin:0 0 16px}
.err{color:var(--nope);font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REASONS = [['style','画风不喜欢'],['character','角色不对'],['composition','构图差'],['resolution','分辨率低'],['other','其他']];
const S = { profiles: [], pid: null, tab: 'new', items: [], idx: 0, clip: false, translate: false };
try { S.pid = +localStorage.getItem('pd_pid') || null; } catch (e) {}

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && path !== '/login') { renderLogin(); throw new Error('401'); }
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}

/* ---------- 登录 ---------- */
function renderLogin(msg = '') {
  $('#app').replaceChildren(el(`<div class="login"><h1>paperdrift</h1>
    <input id="pw" type="password" placeholder="密码" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--dim)"><input id="showpw" type="checkbox" style="width:auto"> 显示密码</label>
    <div class="err">${esc(msg)}</div><button class="primary" id="go" style="width:100%;margin-top:6px">登录</button></div>`));
  const go = async () => {
    try { await api('/login', { method: 'POST', body: { password: $('#pw').value } }); boot(); }
    catch (e) { renderLogin(e.message); }
  };
  $('#showpw').onchange = e => { $('#pw').type = e.target.checked ? 'text' : 'password'; };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };   // 注意不能 return false，否则会吞掉所有按键 $('#pw').focus();
}

/* ---------- 主界面 ---------- */
async function boot() {
  try { S.profiles = await api('/profiles'); const me = await api('/me'); S.clip = me.clip; S.translate = !!me.translate; } catch (e) { return; }
  if (!S.profiles.find(p => p.id === S.pid)) S.pid = S.profiles[0]?.id ?? null;
  renderShell(); if (S.pid) loadItems();
}

function curProfile() { return S.profiles.find(p => p.id === S.pid); }

function renderShell() {
  const p = curProfile();
  const opts = S.profiles.map(x => `<option value="${x.id}" ${x.id === S.pid ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const c = p?.counts || {};
  $('#app').replaceChildren(el(`<div>
    <header>
      <select id="psel" class="grow">${opts || '<option>（还没有需求）</option>'}</select>
      <button id="newp">＋ 新需求</button>
      ${p ? `<button id="refp">参考图 ${p.refs || 0}</button>` : ''}
      ${p ? `<button id="runp" ${p.running ? 'disabled' : ''}>${p.running ? '抓取中…' : '立即抓取'}</button><button id="delp" title="删除需求">🗑</button>` : ''}
      <button id="logout">退出</button>
    </header>
    <main>
      ${p ? `<div class="status" style="margin-bottom:2px">${esc(p.query)} · 每 ${p.interval_hours} 小时 · ${p.target === 'any' ? '不限终端' : p.target === 'landscape' ? '横屏' : '竖屏'}</div>
      <div class="status" id="prog" style="margin-top:0">${progressHtml(p)}</div>
      <div class="status" id="learn" style="margin-top:0;height:66px;overflow:hidden">${learnHtml(p)}</div>
      <div class="tabs">
        <button data-tab="new" class="${S.tab === 'new' ? 'on' : ''}">待审 ${c.new || 0}</button>
        <button data-tab="liked" class="${S.tab === 'liked' ? 'on' : ''}">已喜欢 ${c.liked || 0}</button>
        <button data-tab="rejected" class="${S.tab === 'rejected' ? 'on' : ''}">不要 ${c.rejected || 0}</button>
      </div><div id="view"></div>` : '<div class="empty">点右上角「＋ 新需求」，写几个关键词就行</div>'}
    </main></div>`));
  $('#psel')?.addEventListener('change', e => { S.pid = +e.target.value; try { localStorage.setItem('pd_pid', S.pid); } catch (x) {} S.idx = 0; renderShell(); loadItems(); });
  $('#newp').onclick = openNew;
  $('#refp')?.addEventListener('click', openRefs);
  $('#logout').onclick = async () => { await api('/logout', { method: 'POST' }); renderLogin(); };
  $('#runp')?.addEventListener('click', startRun);
  bindProg(); schedulePoll();
  $('#delp')?.addEventListener('click', async () => { if (confirm('删除这个需求及其所有图片记录？')) { await api(`/profiles/${S.pid}`, { method: 'DELETE' }); S.pid = null; boot(); } });
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.idx = 0; renderShell(); loadItems(); });
}

/* ---------- 抓取进度 ---------- */
let poll = null, note = '';
const fmtSec = n => n < 60 ? `${n} 秒` : `${Math.floor(n / 60)} 分 ${n % 60} 秒`;
function progressHtml(p) {
  const r = p.running;
  if (!r) {
    const st = p.search_terms, tr = st && st.for === p.query && (st.danbooru || []).length
      ? `<br>🔤 已翻译为：${esc((st.danbooru || []).join(' '))}（Danbooru）${(st.wallhaven || []).length ? ' / ' + esc(st.wallhaven.join(' ')) + '（Wallhaven）' : ''}` : '';
    return (note ? `<b>${esc(note)}</b><br>` : '') + `上次：${esc(p.last_status || '尚未运行')}${tr}`;
  }
  const cnt = r.total ? ` ${r.done}/${r.total}` : '';
  return `<div class="progress"><div class="bar" style="width:${r.pct}%"></div></div>
    ⏳ ${r.cancelling ? '正在取消…' : esc(r.stage) + cnt + (r.detail ? ' · ' + esc(r.detail) : '')} · ${r.pct}% · 已用 ${fmtSec(r.elapsed)}
    ${r.cancelling ? '' : '<button id="cancelp" class="mini">取消抓取</button>'}
    ${note ? `<br><b>${esc(note)}</b>` : ''}`;
}
function bindProg() {
  $('#cancelp')?.addEventListener('click', async () => { await api(`/profiles/${S.pid}/cancel`, { method: 'POST' }); tick(); });
  $('#loadnew')?.addEventListener('click', () => { note = ''; loadItems(); updateProgress(); });
}
function updateProgress() {
  const p = curProfile(); if (!p) return;
  const box = $('#prog'); if (box) { box.innerHTML = progressHtml(p); bindProg(); }
  const b = $('#runp'); if (b) { b.disabled = !!p.running; b.textContent = p.running ? '抓取中…' : '立即抓取'; }
  syncTabs();
}
function schedulePoll() { if (!poll && S.profiles.some(p => p.running)) poll = setInterval(tick, 2000); }
async function tick() {
  const was = new Set(S.profiles.filter(p => p.running).map(p => p.id));
  try { S.profiles = await api('/profiles'); } catch (e) { return; }
  if (!S.profiles.some(p => p.running)) { clearInterval(poll); poll = null; }
  const done = [...was].filter(id => !S.profiles.find(p => p.id === id)?.running);
  if (done.includes(S.pid)) await onFinished(); else updateProgress();
}
async function onFinished() {
  const p = curProfile(); note = '';
  const pendingLocal = S.items.slice(S.idx).filter(i => (i.status || 'new') === 'new').length;
  if (S.tab === 'new' && p && (p.counts.new || 0) > pendingLocal) {
    if (!S.items.length || S.idx >= S.items.length) { await loadItems(); }       // 队列空着：直接把新图载进来
    else note = `✅ 抓取完成，有新图了`;                                            // 正在审别的：不打断，给个按钮
  }
  updateProgress();
  if (note) { $('#prog').insertAdjacentHTML('beforeend', ' <button id="loadnew" class="mini">载入新图</button>'); bindProg(); }
}
async function startRun() {
  let r;
  try { r = await api(`/profiles/${S.pid}/run`, { method: 'POST' }); } catch (e) { return; }
  S.profiles = await api('/profiles');
  note = r.started ? '' : r.reason;                                               // 已在抓取中：提示一下，不会重复开始
  updateProgress(); schedulePoll();
  if (note) setTimeout(() => { note = ''; updateProgress(); }, 3000);
}

async function refresh() { S.profiles = await api('/profiles'); renderShell(); loadItems(); }

async function loadItems() {
  if (!S.pid) return;
  S.items = await api(`/items?profile_id=${S.pid}&status=${S.tab}&limit=${S.tab === 'new' ? 100 : 60}`);
  S.idx = 0; renderView();
}

function renderView() {
  const v = $('#view'); if (!v) return;
  if (!S.items.length) { v.replaceChildren(el(`<div class="empty">${S.tab === 'new' ? (curProfile()?.running ? '⏳ 正在抓取，完成后会自动显示新图，不用刷新' : '待审队列是空的<br>点「立即抓取」，或等下一次定时抓取') : '这里还没有内容'}</div>`)); return; }
  if (S.tab === 'new') return renderCard(v);
  v.replaceChildren(el(`<div class="grid">${S.items.map(i => `
    <div class="cell"><a href="${esc(i.page_url)}" target="_blank" rel="noopener"><img loading="lazy" src="/api/items/${i.id}/preview"></a>
    <div class="row">${S.tab === 'liked' ? `<a href="/api/items/${i.id}/file" download>下载原图</a>` : ''}
    <button data-undo="${i.id}">移回待审</button></div></div>`).join('')}</div>`));
  v.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => { await api(`/items/${b.dataset.undo}/decision`, { method: 'POST', body: { decision: 'undo' } }); refresh(); });
}

function renderCard(v) {
  if (S.idx >= S.items.length) {
    v.replaceChildren(el(`<div class="empty">这一批看完了 👍<br><br>
      <button id="back" ${S.items.length ? '' : 'disabled'}>‹ 回看上一张</button> <button id="reload">刷新队列</button></div>`));
    $('#back').onclick = () => go(-1); $('#reload').onclick = refresh; return;
  }
  const i = S.items[S.idx], st = i.status || 'new';
  const rname = Object.fromEntries(REASONS)[i.reason];
  v.replaceChildren(el(`<div>
    <div class="stage">
      <div class="card" id="card"><div class="pic">
          <button class="nav prev" id="prev" aria-label="上一张" ${S.idx === 0 ? 'disabled' : ''}>‹</button>
          <img src="/api/items/${i.id}/preview" alt="">
          <button class="nav next" id="next" aria-label="下一张">›</button></div>
        <div class="meta"><span class="badge ${i.kind === 'video' ? 'video' : ''}">${i.kind === 'video' ? '视频' : i.kind === 'gif' ? '动图' : '静图'}</span>
          <span class="badge">${esc(i.source)}</span><span class="badge">${i.width || '?'}×${i.height || '?'}</span>
          <span class="badge">${i.score.toFixed(2)}</span><a href="${esc(i.page_url)}" target="_blank" rel="noopener" style="color:var(--accent)">原页面</a>
          <span style="margin-left:auto">${S.idx + 1} / ${S.items.length}</span></div>
        <div class="tags">${i.tags.slice(0, 24).map(t => `<span>${esc(t)}</span>`).join('')}</div></div>
    </div>
    <div class="bslot">${st !== 'new' ? `<div class="banner ${st}"><span>${st === 'liked' ? '👍 已标记喜欢' : '👎 已标记不要' + (rname ? '（' + rname + '）' : '')}</span><button id="undo">撤销，移回待审</button></div>` : ''}</div>
    <div class="actions"><button class="nope" id="nope">👎 不要</button><button class="like" id="like">👍 喜欢</button></div>
    <div class="reasons"><span class="rl">不要，并说明原因：</span>${REASONS.map(([k, t], n) => `<button data-r="${k}">${n + 1} ${t}</button>`).join('')}</div>
    <div class="hint">← → 上一张 / 下一张 · ↑ 喜欢 · ↓ 不要 · 数字键 1–5 按原因不要 · Z 撤销上一次</div></div>`));
  $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  $('#like').onclick = () => decide('like');
  $('#nope').onclick = () => decide('reject');
  $('#undo')?.addEventListener('click', () => undoItem(i));
  v.querySelectorAll('.reasons button').forEach(b => b.onclick = () => decide('reject', b.dataset.r));
  const card = $('#card'); let x0 = null;
  card.ontouchstart = e => { x0 = e.touches[0].clientX; };
  card.ontouchmove = e => { if (x0 !== null) card.style.transform = `translateX(${(e.touches[0].clientX - x0) / 3}px)`; };
  card.ontouchend = e => { const dx = e.changedTouches[0].clientX - x0; card.style.transform = ''; x0 = null; if (dx > 90) go(-1); else if (dx < -90) go(1); };
}

function go(d) { S.idx = Math.min(Math.max(S.idx + d, 0), S.items.length); renderView(); }

let last = null;
async function decide(decision, reason) {
  const i = S.items[S.idx]; if (!i) return;
  try { await api(`/items/${i.id}/decision`, { method: 'POST', body: { decision, reason } }); } catch (e) { alert(e.message); return; }
  const to = decision === 'like' ? 'liked' : 'rejected';
  if ((i.status || 'new') !== to) bump(i.status || 'new', to);       // 改主意（喜欢↔不要）时计数也跟着变
  i.status = to; i.reason = decision === 'reject' ? (reason || null) : null;
  last = i; S.idx++; renderView();
}
async function undoItem(i) {
  if (!i || (i.status || 'new') === 'new') return;
  await api(`/items/${i.id}/decision`, { method: 'POST', body: { decision: 'undo' } });
  bump(i.status, 'new'); i.status = 'new'; i.reason = null; S.idx = Math.max(0, S.items.indexOf(i)); renderView();
}
function bump(from, to) {
  const c = (curProfile().counts ||= {}); c[from] = Math.max(0, (c[from] || 0) - 1); c[to] = (c[to] || 0) + 1; syncTabs();
}
function learnHtml(p) {
  const c = p?.counts || {}, l = c.liked || 0, r = c.rejected || 0, f = p?.refs || 0;
  const sig = l + f;
  const msg = sig === 0 ? '⚠ 还没有任何「正样本」：系统不知道你喜欢什么，只能靠热度和多样性试探。<b>上传参考图，或在待审里先给接近的图点「喜欢」</b>，它才会往你喜欢的方向靠。'
    : sig < 3 ? '正样本还很少，会继续多样化试探；多点几张「喜欢」会更准。'
    : '已在学习：往喜欢的图靠拢、远离不要的图' + (l >= 2 ? '，并按喜欢的图的共同标签扩展搜索。' : '。');
  return `🧠 已学习：喜欢 ${l} · 不要 ${r} · 参考图 ${f}<br>${msg}`;
}
function syncTabs() {
  const ln = document.getElementById('learn'); if (ln) ln.innerHTML = learnHtml(curProfile());
  const c = curProfile()?.counts || {}, names = { new: '待审', liked: '已喜欢', rejected: '不要' };
  document.querySelectorAll('.tabs button').forEach(b => b.textContent = `${names[b.dataset.tab]} ${c[b.dataset.tab] || 0}`);
}
document.addEventListener('keydown', e => {
  if (S.tab !== 'new' || e.target.matches('input,textarea,select') || $('dialog[open]') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, handled = () => e.preventDefault();
  if (k === 'ArrowLeft') { handled(); go(-1); }
  else if (k === 'ArrowRight') { handled(); go(1); }
  else if (k === 'ArrowUp') { handled(); decide('like'); }
  else if (k === 'ArrowDown') { handled(); decide('reject'); }
  else if (/^[1-5]$/.test(k)) decide('reject', REASONS[+k - 1][0]);
  else if (k.toLowerCase() === 'z') undoItem(last);
});

/* ---------- 参考图 ---------- */
// 上传前在浏览器里压缩：反向代理（nginx）默认只放行 1MB 的请求体，手机照片/截图经常超过。CLIP 只需要 224px，压缩不影响效果。
const REF_LIMIT = 900 * 1024;
async function shrink(file) {
  if (file.size <= REF_LIMIT && /^image\/(png|jpe?g|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    let scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    for (const q of [0.9, 0.8, 0.7, 0.6, 0.5]) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      if (blob && blob.size <= REF_LIMIT) return blob;
      scale *= 0.8;
    }
  } catch (e) { /* 浏览器解不了（如 HEIC）：原样上传 */ }
  return file;
}
async function openRefs() {
  const d = el(`<dialog><h3 style="margin:0 0 4px">参考图</h3>
    <div class="status">上传你喜欢的图，系统会优先找「感觉相近」的。${S.clip ? '' : '<br><b>服务器还没启用 CLIP，参考图会先保存，启用后自动生效。</b>'}</div>
    <div class="grid" id="r_grid" style="grid-template-columns:repeat(auto-fill,minmax(90px,1fr))"></div>
    <input id="r_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple style="margin-top:12px">
    <div class="err" id="r_err"></div>
    <button id="r_close" style="width:100%;margin-top:8px">关闭</button></dialog>`);
  document.body.append(d); d.showModal(); d.onclose = () => { d.remove(); refresh(); };
  const draw = async () => {
    const refs = await api(`/profiles/${S.pid}/refs`);
    $('#r_grid', d).replaceChildren(...refs.map(r => el(`<div class="cell" style="position:relative">
      <img src="/api/refs/${r.id}/image" style="aspect-ratio:1">
      <button data-del="${r.id}" style="position:absolute;top:4px;right:4px;padding:0 7px;border-radius:999px">×</button></div>`)));
    d.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api(`/refs/${b.dataset.del}`, { method: 'DELETE' }); draw(); });
  };
  $('#r_close', d).onclick = () => d.close();
  $('#r_file', d).onchange = async e => {
    $('#r_err', d).textContent = '上传中…';
    for (const f of e.target.files) {
      const blob = await shrink(f);
      const r = await fetch(`/api/profiles/${S.pid}/refs`, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
      if (!r.ok) { $('#r_err', d).textContent = `${f.name}：` + (r.status === 413 ? '图片太大，服务器拒收（已尝试压缩）' : ((await r.json().catch(() => ({}))).detail || r.statusText)); return; }
    }
    $('#r_err', d).textContent = ''; e.target.value = ''; draw();
  };
  draw();
}

/* ---------- 新建需求 ---------- */
function openNew() {
  const d = el(`<dialog><h3 style="margin:0 0 4px">新需求</h3>
    <label>名称</label><input id="n_name" placeholder="例如：原神-雷电将军">
    <label>${S.translate ? '描述（必填；可以直接用中文写，会自动翻译成搜索关键词）' : '描述 / 关键词（必填；逗号分隔。目前请用英文或站点标签，如 raiden_shogun, genshin_impact）'}</label>
    <textarea id="n_q" rows="2" placeholder="raiden shogun, genshin impact"></textarea>
    <div class="warn" id="n_hint" style="display:none">${S.translate ? '🔤 检测到中文，抓取时会先自动翻译成英文标签。' : '⚠'}${S.translate ? '<span style="display:none">' : ''} 目前只能搜<b>英文关键词或站点标签</b>，写中文会搜不到结果（服务器还没配置自动翻译）。例如：<code>genshin impact, solo, 1girl</code>${S.translate ? '</span>' : ''}</div>
    <label>目标终端（可选）</label><select id="n_t"><option value="any">不限</option><option value="landscape">电脑 / 横屏</option><option value="portrait">手机 / 竖屏</option></select>
    <label>抓取频率</label><select id="n_h"><option value="24">每天一次</option><option value="12">每 12 小时</option><option value="72">每 3 天</option><option value="168">每周</option></select>
    <label style="display:flex;gap:8px;align-items:center"><input id="n_nsfw" type="checkbox" style="width:auto"> 允许 NSFW（默认只要 SFW）</label>
    <div class="err" id="n_err"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button id="n_cancel" style="flex:1">取消</button><button id="n_ok" class="primary" style="flex:1">创建</button></div></dialog>`);
  document.body.append(d); d.showModal();
  d.onclose = () => d.remove();
  $('#n_q', d).oninput = e => { $('#n_hint', d).style.display = /[\u4e00-\u9fff]/.test(e.target.value) ? 'block' : 'none'; };
  $('#n_cancel', d).onclick = () => d.close();
  $('#n_ok', d).onclick = async () => {
    const q = $('#n_q', d).value.trim(), name = $('#n_name', d).value.trim() || q.split(/[,，]/)[0];
    if (!q) { $('#n_err', d).textContent = '描述/关键词不能为空'; return; }
    try {
      const p = await api('/profiles', { method: 'POST', body: { name, query: q, target: $('#n_t', d).value, interval_hours: +$('#n_h', d).value, nsfw: $('#n_nsfw', d).checked } });
      S.pid = p.id; d.close(); await api(`/profiles/${p.id}/run`, { method: 'POST' }); S.tab = 'new'; await boot();
    } catch (e) { $('#n_err', d).textContent = e.message; }
  };
}

boot();
